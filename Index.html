<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffa4c8 0%, #ff6b9d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 80px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }

        h1 {
            font-size: 2.5em;
            color: #ff1744;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        #funnyText {
            font-size: 1.1em;
            color: #666;
            margin-top: 20px;
            min-height: 30px;
            font-style: italic;
        }

        .heart {
            font-size: 80px;
            margin-bottom: 30px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
            min-height: 60px;
        }
        
        .button-wrapper {
            position: relative;
            min-width: 150px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff1744 0%, #ff6b9d 100%);
            color: white;
            position: relative;
        }

        #noBtn {
            background: linear-gradient(135deg, #9e9e9e 0%, #616161 100%);
            color: white;
            position: absolute;
            transition: all 0.3s ease;
        }

        .celebration {
            display: none;
            animation: celebrationPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes celebrationPop {
            0% { 
                opacity: 0; 
                transform: scale(0) rotate(-180deg); 
            }
            50% {
                transform: scale(1.1) rotate(10deg);
            }
            100% { 
                opacity: 1; 
                transform: scale(1) rotate(0deg); 
            }
        }

        .celebration h2 {
            animation: heartbeatBig 1s ease-in-out infinite;
        }

        @keyframes heartbeatBig {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.05); }
        }

        .floating-heart {
            position: fixed;
            font-size: 30px;
            animation: floatUp 3s ease-in-out forwards;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkleAnim 1s ease-out forwards;
            pointer-events: none;
            box-shadow: 0 0 10px #fff;
        }

        @keyframes sparkleAnim {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff1744;
            position: absolute;
            animation: fall 3s linear;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">❤️</div>
        <h1>Sakshi, will you be my Valentine?</h1>
        <p id="funnyText"></p>
        
        <div class="buttons">
            <div class="button-wrapper">
                <button id="yesBtn">Yes! 💕</button>
            </div>
            <div class="button-wrapper">
                <button id="noBtn">No</button>
            </div>
        </div>

        <div class="celebration" id="celebration">
            <h2 style="color: #ff1744; font-size: 2em; margin-top: 30px;">
                Yay! You made me the happiest! 🎉💕
            </h2>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const celebration = document.getElementById('celebration');
        const container = document.querySelector('.container');
        const funnyText = document.getElementById('funnyText');
        
        let attemptCount = 0;
        let yesBtnScale = 1;

        const funnyMessages = [
            "Wait... think about this! 🤔",
            "Are you sure about that? 😅",
            "The No button is broken! 🔧",
            "Come on, you know you want to say yes! 💕",
            "I'll take that as a maybe? 🥺",
            "The No button has left the chat 💨",
            "Why are you running from love? 😢",
            "Just click Yes already! 😂",
            "I see what you're doing... 👀",
            "The Yes button is looking pretty good right now 😉",
            "This is harder than it needs to be! 😆",
            "Fine, I'll make the Yes button bigger! ⬆️"
        ];

        // Function to send notification - CONFIGURE THIS WITH YOUR DETAILS
        async function sendNotification(action) {
            const timestamp = new Date().toLocaleString();
            const message = `Valentine Alert: ${action} at ${timestamp}`;
            
            console.log(message); // Always log to console
            
            // OPTION 1: Send to a webhook (Discord, Slack, etc.)
            // Uncomment and add your webhook URL
            /*
            try {
                await fetch('YOUR_WEBHOOK_URL_HERE', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: message,
                        content: message
                    })
                });
            } catch (error) {
                console.error('Notification failed:', error);
            }
            */
            
            // OPTION 2: Send to your own server endpoint
            // Uncomment and add your server URL
            /*
            try {
                await fetch('https://your-server.com/valentine-alert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: action,
                        timestamp: timestamp
                    })
                });
            } catch (error) {
                console.error('Notification failed:', error);
            }
            */
            
            // OPTION 3: Send email via a service like EmailJS
            // You'll need to include EmailJS library and configure it
            /*
            emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                message: message,
                action: action
            });
            */
        }

        // Track mouse movement to make No button run away
        document.addEventListener('mousemove', (e) => {
            if (celebration.style.display === 'block') return;
            
            const noBtnRect = noBtn.getBoundingClientRect();
            const noBtnCenterX = noBtnRect.left + noBtnRect.width / 2;
            const noBtnCenterY = noBtnRect.top + noBtnRect.height / 2;
            
            const distance = Math.sqrt(
                Math.pow(e.clientX - noBtnCenterX, 2) + 
                Math.pow(e.clientY - noBtnCenterY, 2)
            );
            
            // If cursor is within 100px of the button, make it run away
            if (distance < 100) {
                moveNoButton();
            }
        });

        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        function moveNoButton() {
            attemptCount++;
            
            // Send notification about No button attempt
            sendNotification(`She tried to click NO (Attempt #${attemptCount})`);
            
            // Show funny message
            if (attemptCount <= funnyMessages.length) {
                funnyText.textContent = funnyMessages[attemptCount - 1];
            }
            
            // Make Yes button bigger every 3 attempts
            if (attemptCount % 3 === 0) {
                yesBtnScale += 0.2;
                yesBtn.style.transform = `scale(${yesBtnScale})`;
            }
            
            // Move the button within a limited area to keep it visible but hard to click
            const randomX = (Math.random() - 0.5) * 200;
            const randomY = (Math.random() - 0.5) * 150;
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            
            // Add a little shake animation to the No button
            noBtn.style.animation = 'none';
            setTimeout(() => {
                noBtn.style.animation = 'shake 0.5s';
            }, 10);
        }

        // Yes button celebration
        yesBtn.addEventListener('click', () => {
            // Send notification that she said YES!
            sendNotification('She said YES! 💕🎉');
            
            // Create sparkle burst from button
            createSparkleBurst(yesBtn);
            
            // Flash the screen
            flashScreen();
            
            // Show celebration after a brief moment
            setTimeout(() => {
                celebration.style.display = 'block';
                funnyText.style.display = 'none';
                yesBtn.style.display = 'none';
                noBtn.style.display = 'none';
                
                // Create confetti
                createConfetti();
                
                // Create floating hearts
                createFloatingHearts();
            }, 300);
        });

        function flashScreen() {
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100vw';
            flash.style.height = '100vh';
            flash.style.background = 'white';
            flash.style.opacity = '0';
            flash.style.transition = 'opacity 0.3s';
            flash.style.pointerEvents = 'none';
            flash.style.zIndex = '9999';
            document.body.appendChild(flash);
            
            setTimeout(() => flash.style.opacity = '0.7', 10);
            setTimeout(() => flash.style.opacity = '0', 200);
            setTimeout(() => flash.remove(), 500);
        }

        function createSparkleBurst(element) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            for (let i = 0; i < 30; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                
                const angle = (Math.PI * 2 * i) / 30;
                const velocity = 100 + Math.random() * 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                sparkle.style.left = centerX + 'px';
                sparkle.style.top = centerY + 'px';
                sparkle.style.setProperty('--tx', tx + 'px');
                sparkle.style.setProperty('--ty', ty + 'px');
                
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1000);
            }
        }

        function createFloatingHearts() {
            const hearts = ['❤️', '💕', '💖', '💗', '💝', '💞'];
            
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.bottom = '0';
                    heart.style.animationDelay = Math.random() * 0.5 + 's';
                    heart.style.animationDuration = (2 + Math.random() * 2) + 's';
                    
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 4000);
                }, i * 100);
            }
        }

        function createConfetti() {
            const colors = ['#ff1744', '#ff6b9d', '#ffa4c8', '#ff4081', '#f50057'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
